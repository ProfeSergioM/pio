name: piobot

# El cron de Actions no baja de cinco minutos y además llega tarde seguido, así
# que el intervalo entre píos no se le pide a él: cada ejecución dura una ronda
# y va piando con esperas al azar de entre 3 y 14 minutos. El cron sólo se
# encarga de que siempre haya una ronda viva.
on:
  schedule:
    - cron: '*/15 * * * *'
  # Para probarlo a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Cuánto dura la ronda'
        required: false
        default: '13'

# Si una ronda se pasó de largo, la siguiente espera en vez de pisarla: dos
# bots piando a la vez duplicarían el ritmo.
concurrency:
  group: piobot
  cancel-in-progress: false

jobs:
  piar:
    runs-on: ubuntu-latest
    # La ronda son 13 minutos; el margen es por si una espera queda justa.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No hay `npm install`: el proyecto no tiene dependencias.
      - name: Piar
        env:
          PIO_SITIO: ${{ vars.PIO_SITIO }}
          PIOBOT_USUARIO: ${{ vars.PIOBOT_USUARIO }}
          PIOBOT_CLAVE: ${{ secrets.PIOBOT_CLAVE }}
          PIOBOT_MINUTOS: ${{ github.event.inputs.minutos || '13' }}
        run: node bot/piobot.js
