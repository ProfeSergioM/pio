<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pío — 100 caracteres y listo</title>
<meta name="description" content="Pío: una red social donde cada mensaje entra en 100 caracteres.">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<!-- Para instalarse como app: el manifiesto, el color de la barra y el ícono
     que usa el iPhone al "Agregar a inicio". -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f07c1f">
<link rel="apple-touch-icon" href="/iconos/apple-180.png?v=2">
<meta name="apple-mobile-web-app-title" content="Pío">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" id="hoja-diseno" href="">
</head>
<body>

<div id="portada" class="portada" hidden>
  <div class="portada-arte" aria-hidden="true">
    <img class="pollito" src="/logo.svg" alt="">
    <div class="globo">¡pío!</div>
  </div>
  <div class="portada-caja">
    <div class="portada-cabecera">
      <h1 class="marca"><img class="marca-pollito" src="/logo.svg" alt=""> Pío</h1>
      <div class="idiomas" id="idiomas-portada" role="group"></div>
    </div>
    <p class="lema"><span data-t="portada.lema1"></span><br><span data-t="portada.lema2"></span></p>

    <div class="pestanas" role="tablist">
      <button class="pestana activa" data-modo="entrar" role="tab" data-t="acceso.entrar"></button>
      <button class="pestana" data-modo="registro" role="tab" data-t="acceso.crear"></button>
    </div>

    <form id="forma-acceso" autocomplete="on" novalidate>
      <label class="campo">
        <span data-t="campo.usuario"></span>
        <div class="con-arroba">
          <span>@</span>
          <input name="usuario" maxlength="15" required autocomplete="username"
                 placeholder="pollito_01" data-usuario>
        </div>
      </label>

      <label class="campo solo-registro" hidden>
        <span data-t="campo.nombre"></span>
        <input name="nombre" maxlength="30" placeholder="Pollito Primero">
      </label>

      <label class="campo solo-recuperar" hidden>
        <span data-t="campo.codigo"></span>
        <input name="codigo" autocomplete="off" data-t-ph="campo.codigo.ph">
      </label>

      <label class="campo">
        <span data-t="campo.clave"></span>
        <input name="clave" type="password" minlength="6" required
               autocomplete="current-password" data-t-ph="campo.clave.ph">
      </label>

      <p id="error-acceso" class="error" role="alert" hidden></p>
      <button class="boton principal ancho" type="submit" data-t="acceso.boton.entrar"></button>
    </form>

    <p class="chico centrado">
      <button type="button" class="enlace" id="olvide" data-t="acceso.olvide"></button>
    </p>

    <div id="con-google" hidden>
      <div class="separador"><span data-t="acceso.o"></span></div>
      <div id="boton-google" class="boton-google"></div>
    </div>

    <p class="chico" data-t-html="portada.local"></p>
  </div>
</div>

<div id="app" class="app" hidden>

  <header class="barra-superior">
    <button class="icono solo-movil" id="atras" data-t-titulo="barra.volver" hidden>←</button>
    <h1 class="marca chica"><img class="marca-pollito" src="/logo.svg" alt=""> Pío</h1>
    <div class="barra-acciones">
      <button class="icono" id="instalar-barra" data-t-titulo="nav.instalar" hidden>📲</button>
      <button class="icono" id="idioma" data-t-titulo="barra.idioma">🌐</button>
      <button class="icono" id="tema" data-t-titulo="barra.tema">◐</button>
    </div>
  </header>

  <nav class="lateral">
    <h1 class="marca solo-escritorio"><img class="marca-pollito" src="/logo.svg" alt=""> Pío</h1>
    <a class="nav" href="#/nido" data-nav="nido"><span>🪹</span><em data-t="nav.nido"></em></a>
    <a class="nav" href="#/plaza" data-nav="plaza"><span>🌎</span><em data-t="nav.plaza"></em></a>
    <a class="nav" href="#/avisos" data-nav="avisos">
      <span class="con-insignia">🔔<b class="insignia" id="insignia" hidden></b></span><em data-t="nav.avisos"></em>
    </a>
    <a class="nav" href="#/corrales" data-nav="corrales"><span>🚜</span><em data-t="nav.corrales"></em></a>
    <a class="nav" href="#/buscar" data-nav="buscar"><span>🔍</span><em data-t="nav.buscar"></em></a>
    <a class="nav" href="#/yo" data-nav="yo"><span>🐣</span><em data-t="nav.perfil"></em></a>
    <a class="nav" href="#/disenos" data-nav="disenos"><span>🎨</span><em data-t="nav.disenos"></em></a>
    <a class="nav" href="#/admin" data-nav="admin" id="nav-admin" hidden><span>🎛️</span><em data-t="nav.admin"></em></a>
    <button class="nav oculto-movil" id="idioma-lateral" type="button"><span>🌐</span><em data-t="nav.idioma"></em></button>
    <button class="nav oculto-movil" id="tema-lateral" type="button"><span>◐</span><em data-t="nav.tema"></em></button>
    <button class="nav oculto-movil" id="instalar-lateral" type="button" hidden><span>📲</span><em data-t="nav.instalar"></em></button>
    <button class="boton principal ancho solo-escritorio" id="piar-lateral" data-t="boton.piar"></button>
    <div class="yo-lateral solo-escritorio" id="yo-lateral"></div>
  </nav>

  <main class="columna" id="columna">
    <div id="cabecera-vista"></div>
    <div id="contenido" class="contenido"></div>
  </main>

  <aside class="derecha">
    <section class="tarjeta">
      <h2 data-t="lateral.tendencias"></h2>
      <div id="tendencias" class="tendencias"></div>
    </section>
    <section class="tarjeta">
      <h2 data-t="lateral.seguir"></h2>
      <div id="sugerencias" class="sugerencias"></div>
    </section>
    <p class="chico pie" data-t="lateral.pie"></p>
  </aside>

  <button class="flotante solo-movil" id="piar-flotante" data-t-titulo="boton.piar">🐤</button>
</div>

<dialog id="dialogo-piar" class="dialogo">
  <form method="dialog" class="dialogo-caja" id="forma-piar">
    <div class="dialogo-cabecera">
      <button type="button" class="icono" id="cerrar-dialogo" data-t-titulo="dialogo.cerrar">✕</button>
      <span id="dialogo-titulo"></span>
    </div>
    <div id="dialogo-contexto" class="respondiendo" hidden></div>
    <textarea id="texto-pio" maxlength="200" rows="3"
              data-t-ph="dialogo.ph" data-t-aria="dialogo.aria"></textarea>
    <div id="menciones" class="menciones" role="listbox" hidden></div>

    <div id="adjunto-vista" class="adjunto" hidden></div>

    <div id="tablero-gif" class="tablero-gif" hidden>
      <input id="gif-consulta" class="buscador" data-t-ph="gif.ph" autocomplete="off">
      <div id="gif-resultados" class="gif-rejilla"></div>
    </div>

    <input type="file" id="archivo-imagen" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    <div class="dialogo-pie">
      <div class="adjuntar" id="adjuntar">
        <button type="button" class="icono" id="poner-imagen" data-t-titulo="adjunto.imagen">🖼️</button>
        <button type="button" class="icono chico-gif" id="poner-gif" data-t-titulo="adjunto.gif">GIF</button>
        <button type="button" class="icono" id="poner-spotify" data-t-titulo="spotify.boton">🎵</button>
        <button type="button" class="icono arroba" id="poner-mencion" data-t-titulo="mencion.boton">@</button>
        <button type="button" class="icono" id="acortar-enlaces" data-t-titulo="enlace.acortar" hidden>🔗</button>
      </div>
      <div class="medidor" id="medidor">
        <svg viewBox="0 0 36 36" class="anillo" aria-hidden="true">
          <circle class="anillo-fondo" cx="18" cy="18" r="15.5"></circle>
          <circle class="anillo-frente" cx="18" cy="18" r="15.5"></circle>
        </svg>
        <span id="restantes">100</span>
      </div>
      <button class="boton principal" id="enviar-pio" type="submit" data-t="boton.piar" disabled></button>
    </div>
    <p id="error-pio" class="error" role="alert" hidden></p>
  </form>
</dialog>

<dialog id="dialogo-corral" class="dialogo">
  <form method="dialog" class="dialogo-caja" id="forma-corral" novalidate>
    <div class="dialogo-cabecera">
      <button type="button" class="icono" id="cerrar-corral" data-t-titulo="dialogo.cerrar">✕</button>
      <span data-t="corral.nuevo"></span>
    </div>

    <label class="campo">
      <span data-t="corral.titulo"></span>
      <input name="titulo" maxlength="40" data-t-ph="corral.titulo.ph">
    </label>

    <label class="campo">
      <span data-t="corral.nombre"></span>
      <div class="con-arroba">
        <span>/</span>
        <input name="nombre" maxlength="20" autocomplete="off" data-corral>
      </div>
      <small class="chico" data-t="corral.nombre.ayuda"></small>
    </label>

    <label class="campo">
      <span data-t="corral.descripcion"></span>
      <input name="descripcion" maxlength="140" data-t-ph="corral.descripcion.ph">
    </label>

    <p id="error-corral" class="error" role="alert" hidden></p>
    <div class="dialogo-pie">
      <button class="boton principal" type="submit" data-t="corral.crear"></button>
    </div>
  </form>
</dialog>

<dialog id="dialogo-perfil" class="dialogo">
  <form method="dialog" class="dialogo-caja" id="forma-perfil" novalidate>
    <div class="dialogo-cabecera">
      <button type="button" class="icono" id="cerrar-perfil" data-t-titulo="dialogo.cerrar">✕</button>
      <span data-t="perfil.editar"></span>
    </div>

    <div class="campo-avatar">
      <div id="avatar-vista"></div>
      <div class="campo-avatar-botones">
        <button type="button" class="boton chico" id="cambiar-avatar" data-t="perfil.cambiarFoto"></button>
        <button type="button" class="boton fantasma chico" id="quitar-avatar" data-t="perfil.quitarFoto" hidden></button>
      </div>
      <input type="file" id="archivo-avatar" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    </div>

    <label class="campo">
      <span data-t="campo.usuario"></span>
      <div class="con-arroba">
        <span>@</span>
        <input name="usuario" maxlength="15" autocomplete="off" data-usuario>
      </div>
      <small class="chico" id="aviso-usuario"></small>
    </label>

    <label class="campo">
      <span data-t="campo.nombre"></span>
      <input name="nombre" maxlength="30">
    </label>

    <label class="campo">
      <span data-t="campo.bio"></span>
      <input name="bio" maxlength="100" data-t-ph="campo.bio.ph">
    </label>

    <p id="error-perfil" class="error" role="alert" hidden></p>
    <div class="dialogo-pie">
      <button class="boton principal" type="submit" data-t="perfil.guardar"></button>
    </div>
  </form>
</dialog>

<dialog id="dialogo-codigo" class="dialogo">
  <div class="dialogo-caja">
    <div class="dialogo-cabecera">
      <span data-t="codigo.titulo"></span>
    </div>
    <p data-t="codigo.explica"></p>
    <p class="codigo" id="codigo-texto"></p>
    <p class="chico" data-t="codigo.aviso"></p>
    <div class="dialogo-pie">
      <button class="boton" type="button" id="copiar-codigo" data-t="codigo.copiar"></button>
      <button class="boton principal" type="button" id="cerrar-codigo" data-t="codigo.guardado"></button>
    </div>
  </div>
</dialog>

<dialog id="dialogo-clave" class="dialogo">
  <form method="dialog" class="dialogo-caja" id="forma-clave" novalidate>
    <div class="dialogo-cabecera">
      <button type="button" class="icono" id="cerrar-clave" data-t-titulo="dialogo.cerrar">✕</button>
      <span data-t="clave.titulo"></span>
    </div>

    <label class="campo" id="campo-actual">
      <span data-t="clave.actual"></span>
      <input name="actual" type="password" autocomplete="current-password">
    </label>

    <label class="campo">
      <span data-t="clave.nueva"></span>
      <input name="nueva" type="password" autocomplete="new-password" data-t-ph="campo.clave.ph">
    </label>

    <p id="error-clave" class="error" role="alert" hidden></p>
    <div class="dialogo-pie">
      <button class="boton fantasma" type="button" id="pedir-codigo" data-t="codigo.pedirOtro"></button>
      <button class="boton principal" type="submit" data-t="clave.guardar"></button>
    </div>
  </form>
</dialog>

<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
<div id="sin-conexion" class="sin-conexion" role="status" aria-live="polite" data-t="red.sin" hidden></div>

<script src="idiomas.js"></script>
<script src="app.js"></script>
</body>
</html>
